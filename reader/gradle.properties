org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
kotlin.code.style=official
# zstd decompression for ZIM clusters: the plain jar on the Mac, the .aar (with Android native libraries) in the app.
# 1.5.7-4: its native libraries are aligned for 16 KB pages, which Google Play requires, and its
# .aar sets no minimum compileSdk. Later 1.5.7 releases ask for compileSdk 37, which does not exist yet.
zstdVersion=1.5.7-4
