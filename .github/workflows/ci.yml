# Builds everything and checks what can be checked without a device or the 53 GB Wikipedia file:
#
#  - the scripts parse under macOS's own bash 3.2, the version they are written for;
#  - wiki.sh's push, update and "verify device" do the right thing to a stand-in e-reader
#    (ci/device.sh, which also stands in for Kiwix's download server);
#  - the Android app and the indexer build;
#  - the Kotlin code in reader/ and its Swift port in ios/ read a small Wikipedia identically
#    (ci/compare.sh): search results, article bytes, sections and normalized titles;
#  - the iOS app and its UI tests compile.
#
# Not covered, so still to be checked by hand before a change to them is merged: how the apps look
# and behave (the Android emulator, the iOS UI tests, which need a multi-gigabyte Wikipedia), and
# anything about a real e-reader that the stand-in does not imitate.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request replaces a run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  script:
    name: wiki.sh
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # /bin/bash is 3.2 on macOS. A newer bash accepts syntax that 3.2 cannot run.
      - name: Check the scripts' syntax with bash 3.2
        run: |
          /bin/bash --version | head -1
          /bin/bash -n wiki.sh
          /bin/bash -n ci/compare.sh
          /bin/bash -n ci/device.sh
          /bin/bash -n ci/fake-mtp.sh
          /bin/bash -n ios/scripts/testflight-upload.sh
      - name: Run the script
        run: ./wiki.sh help

  android:
    name: Android app and indexer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      # The APK this makes is signed with a throwaway key, so it cannot update an installed app.
      - name: Build
        working-directory: reader
        run: ./gradlew --no-daemon --warning-mode all :indexer:installDist :app:assembleRelease

  compare:
    name: Kotlin and Swift agree
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      # Only the .zim is kept between runs. Its index is built fresh by this commit's indexer every
      # time, since the index is one of the things being checked.
      - name: Keep the test Wikipedia between runs
        id: zim
        uses: actions/cache@v6
        with:
          path: data/zim/*.zim
          key: zim-ray-charles-1
      # A 28 MB Wikipedia about Ray Charles. Fetching it with wiki.sh exercises the download and
      # its checksum as well.
      - name: Download a small Wikipedia
        if: steps.zim.outputs.cache-hit != 'true'
        run: WIKI_BOOK=wikipedia_en_ray-charles ./wiki.sh fetch nopic
      - name: Build the indexer (Kotlin)
        working-directory: reader
        run: ./gradlew --no-daemon -q :indexer:installDist
      - name: Build wikicheck (Swift)
        working-directory: ios
        run: swift build -c release
      - name: Compare the two on the small Wikipedia
        run: ci/compare.sh data/zim/wikipedia_en_ray-charles_nopic_*.zim

  device:
    name: wiki.sh and a stand-in e-reader
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      # The same small Wikipedia as the comparison above: "update" builds a real index of it.
      - name: Keep the test Wikipedia between runs
        id: zim
        uses: actions/cache@v6
        with:
          path: data/zim/*.zim
          key: zim-ray-charles-1
      - name: Download a small Wikipedia
        if: steps.zim.outputs.cache-hit != 'true'
        run: WIKI_BOOK=wikipedia_en_ray-charles ./wiki.sh fetch nopic
      - name: Build the indexer
        working-directory: reader
        run: ./gradlew --no-daemon -q :indexer:installDist
      # No device and no network: the e-reader is a folder behind ci/fake-mtp.sh, and the
      # snapshots "Kiwix publishes" come from a web server the script starts on this machine.
      - name: Push, update and verify against the stand-in
        run: ci/device.sh data/zim/wikipedia_en_ray-charles_nopic_*.zim

  ios:
    name: iOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        run: brew install xcodegen
      # Compiles the app and its UI tests. The tests are not run: they expect articles that only
      # the full or the "top" Wikipedia has.
      - name: Build the app and its UI tests for the simulator
        working-directory: ios
        run: |
          xcodebuild -version
          xcodegen generate
          xcodebuild build-for-testing -project WikiReader.xcodeproj -scheme WikiReader \
            -derivedDataPath DerivedData -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
